name: Backend API

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  push:
    branches: [master]
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  FUNCTION_APP: func-batteryhub-prod-txyfw6k32lguk
  # Deploy identity (OIDC, no stored password). These IDs are not secrets.
  AZURE_CLIENT_ID: 0dbc5eeb-de7c-49f1-bd32-8d04dc402945
  AZURE_TENANT_ID: 1511ab2e-502b-4e2d-bd68-f679f549b5a2
  AZURE_SUBSCRIPTION_ID: cc4830ae-d046-4c26-a392-8659cabaa58a

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    # Deploys to Azure after the tests pass (never from pull request runs).
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build package
        working-directory: backend
        run: |
          npm ci
          npx tsc
          node dist/scripts/build-seed.js > dist/seed.json
          echo "{\"sha\":\"${GITHUB_SHA}\"}" > dist/version.json
          npm prune --omit=dev
          rm -rf dist/test dist/scripts
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP }}
          package: backend
          respect-funcignore: true
      - name: Smoke test
        run: |
          url="https://${FUNCTION_APP}.azurewebsites.net/api/health"
          for i in $(seq 1 12); do
            body=$(curl -sS -m 60 -w ' HTTP %{http_code}' "$url" || true)
            echo "$body"
            # Pass only once the new build is serving and the full catalog is loaded.
            case "$body" in *'"ok":true'*"\"version\":\"${GITHUB_SHA}\""*)
              products=$(echo "$body" | sed -n 's/.*"products":\([0-9]*\).*/\1/p')
              [ "${products:-0}" -ge 30 ] && exit 0 ;;
            esac
            sleep 15
          done
          echo "::error::Health check did not pass: $url"
          exit 1
